<!DOCTYPE html>
<html>
<head>
  <title>Word Search App</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <h1>WordSearch App</h1>
  <form id="form">
    <input type="text" id="input" placeholder="Enter a word" required>
    <button type="submit">Search</button>
    <button type="button" id="clearBtn">Clear</button>
  </form>
  <div id="result"></div>
  <h3>⭐ Favorites</h3>
  <ul id="favList"></ul>
  <p id="error"></p>
  <script src="main.js"></script>
</body>
</html>
